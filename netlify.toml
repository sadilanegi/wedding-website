[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Access-Control-Allow-Origin = "*"
    X-Robots-Tag = "all"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
