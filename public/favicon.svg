<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="crimson-bg" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8f243e" />
      <stop offset="55%" stop-color="#5e1326" />
      <stop offset="100%" stop-color="#330813" />
    </radialGradient>
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6014" />
      <stop offset="25%" stop-color="#e2be5a" />
      <stop offset="50%" stop-color="#fff8d6" />
      <stop offset="75%" stop-color="#c99b32" />
      <stop offset="100%" stop-color="#734c0d" />
    </linearGradient>
  </defs>

  <!-- Outer 24K Gold Wax Seal Rim -->
  <circle cx="32" cy="32" r="30.5" fill="url(#gold-foil)" />
  <circle cx="32" cy="32" r="28" fill="url(#crimson-bg)" />

  <!-- Ornate Dashed Gold Filigree Ring -->
  <circle
    cx="32"
    cy="32"
    r="24.5"
    stroke="url(#gold-foil)"
    stroke-width="1.2"
    stroke-dasharray="3 2.2"
  />
  <circle
    cx="32"
    cy="32"
    r="22"
    stroke="url(#gold-foil)"
    stroke-width="0.7"
    opacity="0.75"
  />

  <!-- Top Royal Crown / Kalash Lotus Motif -->
  <path
    d="M26 16.5 L29.2 12.5 L32 15.5 L34.8 12.5 L38 16.5 L36.5 18.8 H27.5 Z"
    fill="url(#gold-foil)"
  />
  <circle cx="32" cy="10.8" r="1.3" fill="#fff8d6" />

  <!-- S & P Royal Monogram -->
  <text
    x="32"
    y="38.5"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18.5"
    font-weight="bold"
    fill="url(#gold-foil)"
    letter-spacing="0.5"
  >
    S&amp;P
  </text>

  <!-- Bottom Sacred Heart / Lotus Flourish -->
  <path
    d="M32 51.5 C29.2 49 27.5 47.4 27.5 45.8 C27.5 44.5 28.5 43.6 29.8 43.6 C30.8 43.6 31.5 44.1 32 44.9 C32.5 44.1 33.2 43.6 34.2 43.6 C35.5 43.6 36.5 44.5 36.5 45.8 C36.5 47.4 34.8 49 32 51.5 Z"
    fill="url(#gold-foil)"
  />
</svg>
